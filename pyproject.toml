[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comp6704-query-adapt"
version = "0.1.0"
description = "Convex query adaptation: data preparation and optimization solvers"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "torch>=2.2,<3", "threadpoolctl>=3,<4",
  "sentence-transformers>=3,<6", "huggingface-hub>=0.25,<2", "beir>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
query-adapt = "query_adapt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
